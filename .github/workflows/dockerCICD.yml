# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI pipeline

on:
  push:
    branches: [ "features-salome", "features-alejandro", "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [25.x] # Esta es la version que soporta nuestro proyecto en otras versiones falla
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma Client
      run: npx prisma generate
    - name: Build
      run: npm run build
    - name: login to docker hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build docker image
      run: docker build -t alenddy/fis-backend:latest .
      
    - name: Build Database image
      run: docker build -t alenddy/fis-database:latest ./prisma

    - name: Push docker image
      run: docker push alenddy/fis-backend:latest

    - name: Push Database image
      run: docker push alenddy/fis-database:latest