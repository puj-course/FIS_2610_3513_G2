name: Kanban - Mover por keyword en commit

on:
  push:
    branches: [ features-alejandro, features-salome ]

permissions:
  contents: write

jobs:
  move_card:
    runs-on: ubuntu-latest
    environment: .env 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parsear mensaje del commit
        id: parse
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "Commit: $MESSAGE"
          if [[ $MESSAGE =~ (Closes|Refs).?\(?#([0-9]+) ]]; then
            echo "keyword=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "issue_num=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Debug token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ GH_TOKEN está vacío"
          else
            echo "✅ GH_TOKEN tiene valor YIPPEE"
            gh auth status
          fi

      - name: Obtener node ID del issue
        if: steps.parse.outputs.found == 'true'
        id: issue_node
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NODE_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $num) { id }
              }
            }' \
            -f owner="puj-course" \
            -f repo="FIS_2610_3513_G2" \
            -F num=${{ steps.parse.outputs.issue_num }} \
            --jq '.data.repository.issue.id')
          echo "node_id=$NODE_ID" >> $GITHUB_OUTPUT

      - name: Mover tarjeta en el kanban
        if: steps.parse.outputs.found == 'true' && steps.issue_node.outputs.node_id != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NODE: ${{ steps.issue_node.outputs.node_id }}
          KEYWORD: ${{ steps.parse.outputs.keyword }}
          PRJ_ID: ${{ secrets.PROJECT_NODE_ID }}
          FLD_ID: ${{ secrets.STATUS_FIELD_ID }}
          OPT_PROGRESS: ${{ secrets.STATUS_IN_PROGRESS_ID }}
          OPT_REVIEW: ${{ secrets.STATUS_IN_REVIEW_ID }}
        run: |
          echo "Token set: $([[ -n "$GH_TOKEN" ]] && echo 'YES' || echo 'NO')"
          gh auth status

          ITEM_ID=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  items(first: 100) {
                    nodes {
                      id
                      content { ... on Issue { id } }
                    }
                  }
                }
              }
            }' \
            -f org="puj-course" \
            -F num=56 \
            --jq ".data.organization.projectV2.items.nodes[] | select(.content.id == \"$ISSUE_NODE\") | .id")

          if [ -z "$ITEM_ID" ]; then
            echo "No se encontró el issue en el proyecto."
            exit 0
          fi

          if [ "$KEYWORD" == "Closes" ]; then
            TARGET_OPT="$OPT_REVIEW"
          else
            TARGET_OPT="$OPT_PROGRESS"
          fi

          gh api graphql -f query='
            mutation($prj: ID!, $item: ID!, $field: ID!, $opt: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $prj, itemId: $item, fieldId: $field, value: { singleSelectOptionId: $opt }
              }) { projectV2Item { id } }
            }' \
            -f prj="$PRJ_ID" \
            -f item="$ITEM_ID" \
            -f field="$FLD_ID" \
            -f opt="$TARGET_OPT"