name: Kanban - Mover por keyword en commit

on:
  push:
    branches: [ features-alejandro, features-salome ]

permissions:
  contents: read
  repository-projects: write

jobs:
  move_card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parsear mensaje del commit
        id: parse
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "Commit: $MESSAGE"
          
          # Regex mejorada: detecta Closes/Refs con o sin paréntesis y el #
          if [[ $MESSAGE =~ (Closes|Refs).?\(?#([0-9]+) ]]; then
            echo "keyword=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "issue_num=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Obtener node ID del issue
        if: steps.parse.outputs.found == 'true'
        id: issue_node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NODE_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $num) { id }
              }
            }' \
            -f owner="puj-course" \
            -f repo="FIS_2610_3513_G2" \
            -F num=${{ steps.parse.outputs.issue_num }} \
            --jq '.data.repository.issue.id')
          echo "node_id=$NODE_ID" >> $GITHUB_OUTPUT

      - name: Mover tarjeta en el kanban
        if: steps.parse.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NODE_ID: ${{ steps.issue_node.outputs.node_id }}
          KEYWORD: ${{ steps.parse.outputs.keyword }}
          # Tus secretos configurados con el candado
          PROJECT_ID: ${{ secrets.PROJECT_NODE_ID }}
          STATUS_FIELD: ${{ secrets.STATUS_FIELD_ID }}
          ID_IN_PROGRESS: ${{ secrets.STATUS_IN_PROGRESS_ID }}
          ID_IN_REVIEW: ${{ secrets.STATUS_IN_REVIEW_ID }}
        run: |
          # 1. Obtener el ID del item en el proyecto
          ITEM_ID=$(gh api graphql -f query='
            query($projId: ID!, $issueId: ID!) {
              node(id: $projId) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content { ... on Issue { id } }
                    }
                  }
                }
              }
            }' -f projId="$PROJECT_ID" \
            --jq ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_NODE_ID\") | .id")

          if [ -z "$ITEM_ID" ]; then
            echo "No se encontró el issue en el proyecto."
            exit 0
          fi

          # 2. Decidir el estado
          if [ "$KEYWORD" == "Closes" ]; then
            OPTION_ID="$ID_IN_REVIEW"
          else
            OPTION_ID="$ID_IN_PROGRESS"
          fi

          # 3. Actualizar
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$STATUS_FIELD" -f optionId="$OPTION_ID"