
# Deployment para releases, prueba con el push
name: Node.js CD

on:
  push:
    branches: [ "feature/pipelines" ]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Create release package
        run: |
          mkdir -p release
          cp -r dist release/
          cp -r prisma release/
          cp package.json release/
          cp package-lock.json release/
          cd release && zip -r ../recetasya.zip .

      - name: Verify artifact
        run: |
          echo "Contenido del zip:"
          unzip -l recetasya.zip
          echo "Verificando punto de entrada..."
          unzip -p recetasya.zip dist/src/main.js | head -5

      - name: Generate version tag
        id: tag
        run: echo "tag=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          files: recetasya.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}