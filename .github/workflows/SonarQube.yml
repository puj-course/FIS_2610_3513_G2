name: SonarQube

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =====================================================
  # TESTS + COVERAGE
  # =====================================================
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # Node
      # -------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # -------------------------------------------------
      # Dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------
      # Prisma
      # -------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # -------------------------------------------------
      # Tests + Coverage
      # -------------------------------------------------
      - name: Run tests with coverage
        run: |
          npm test -- \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=text \
            --verbose \
            --forceExit || true

      # -------------------------------------------------
      # Debug coverage
      # -------------------------------------------------
      - name: Verify coverage files
        run: |
          echo "===== COVERAGE FOLDER ====="
          ls -R coverage || true

      # -------------------------------------------------
      # Upload coverage
      # Solo se ejecuta si lcov.info existe
      # -------------------------------------------------
      - name: Upload coverage artifact
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  # =====================================================
  # SONAR
  # =====================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # Download coverage
      # -------------------------------------------------
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # -------------------------------------------------
      # Verify files
      # -------------------------------------------------
      - name: Verify downloaded coverage
        run: |
          echo "===== DOWNLOADED COVERAGE ====="
          ls -R coverage

      # -------------------------------------------------
      # SonarCloud
      # -------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=puj-course_FIS_2610_3513_G1
            -Dsonar.organization=puj-course
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
