name: SonarQube

# =========================================================
# EVENTOS QUE DISPARAN EL PIPELINE
# =========================================================
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # JOB 1: TESTS + COVERAGE
  # =========================================================
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:

      # -----------------------------------------------------
      # Clona el repositorio
      # fetch-depth: 0 mejora el análisis de Sonar
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------
      # Configura Node.js
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # -----------------------------------------------------
      # Instala dependencias
      # -----------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------
      # Genera Prisma Client
      # -----------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # -----------------------------------------------------
      # Ejecuta tests y genera coverage
      #
      # || true evita que el job falle aunque
      # existan tests fallando
      # -----------------------------------------------------
      - name: Run tests with coverage
        run: |
          npm test -- \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=text \
            --verbose \
            --forceExit || true

      # -----------------------------------------------------
      # Debug:
      # Verifica si coverage realmente existe
      # -----------------------------------------------------
      - name: Verify coverage files
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== COVERAGE ====="
          ls -R coverage || true

      # -----------------------------------------------------
      # Sube artifact SOLO si existe lcov.info
      # -----------------------------------------------------
      - name: Upload coverage artifact
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage


  # =========================================================
  # JOB 2: SONARQUBE / SONARCLOUD
  # =========================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    # Espera a que termine el job de tests
    needs: test

    steps:

      # -----------------------------------------------------
      # Clona nuevamente el repositorio
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------
      # Descarga coverage
      #
      # continue-on-error evita que falle si
      # el artifact no existe
      # -----------------------------------------------------
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage

      # -----------------------------------------------------
      # Debug:
      # Verifica archivos descargados
      # -----------------------------------------------------
      - name: Verify downloaded coverage
        run: |
          echo "===== DOWNLOADED COVERAGE ====="
          ls -R coverage || true

      # -----------------------------------------------------
      # Ejecuta SonarCloud
      # -----------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=puj-course_FIS_2610_3513_G1
            -Dsonar.organization=puj-course
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8
