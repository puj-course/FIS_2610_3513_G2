version: "3.9"

services:
  database:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  backend:
    build: .
    container_name: backend
    ports:
      - "8080:8080"
      - "5555:5555" # Para ejecutar npx prisma studio
    env_file:
      - .env.docker
    depends_on:
      - database
    networks:
        - frontend
        - backend
    restart: unless-stopped
  
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    networks:
        - frontend
    restart: unless-stopped
    
volumes:
  postgres_data:

networks:
  frontend:
    driver: bridge
    name: frontend_network
  backend: 
    driver: bridge 
    name: backend_network
