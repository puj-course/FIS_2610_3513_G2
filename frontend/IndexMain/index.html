<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecetaYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="https://res.cloudinary.com/dkvds2u3r/image/upload/v1778275838/logo_x1qa7e.png" class="logo-img" alt="RecetaYa">
    <span class="tx">Receta<span>Ya</span></span>
  </a>
  <div class="search-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="Busca un ingrediente..." autocomplete="off"/>
    <span class="search-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </span>
    <div class="suggestions" id="suggestions"></div>
  </div>
  <nav class="nav-links" id="navLinks"></nav>
</header>

<section class="tags-section">
  <div class="tags-header">
    <span class="tags-title">Filtrar por ingrediente</span>
    <button class="tags-clear" id="tagsClear">✕ Limpiar filtros</button>
  </div>
  <div class="tags-wrap" id="tagsWrap"></div>
  <button class="tags-toggle" id="tagsToggle">Ver más ▾</button> 
  <div class="active-bar" id="activeBar">
    <span class="active-bar-label">Activos:</span>
    <div id="activePills"></div>
  </div>
</section>

<section class="results-section">
  <div class="new-banner" id="newBanner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span id="newBannerText"></span>
  </div>
  <div class="tabs-bar">
    <button class="tab active" id="tabTodas">Todas las recetas</button>
  <button class="tab" id="tabGuardadas">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    Mis guardadas
  </button>
    <button class="tab create" id="tabCrear">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>
      Recetas Creadas
    </button>
    <select name="Filtrar" id="btnFilter">
      <option value="todas">Ordenar por...</option>
      <option value="populares">Populares</option>
    </select>
  </div>
  <div class="results-info" id="resultsInfo"></div>
  <div class="cards-grid" id="cardsGrid"></div>
</section>


<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose">&#x2715;</button>
    <button class="lightbox-nav prev" id="lightboxPrev">&#8592;</button>
    <button class="lightbox-nav next" id="lightboxNext">&#8594;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt=""/>
    <div class="lightbox-caption">
      <h3 id="lightboxTitle"></h3>
      <p  id="lightboxSub"></p>
    </div>
  </div>
</div>

<!-- Related to the recipe card to save and report recipes -->
<div class="rmd-overlay" id="rmdOverlay">
  <div class="rmd-card" id="rmdCard">
    <button class="rmd-close" id="rmdClose">&#x2715;</button>

    <div class="rmd-img-area">
      <img class="rmd-photo" id="rmdPhoto" src="" alt="" style="display:none"/>
      <div class="rmd-photo-fallback" id="rmdPhotoFallback">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#e8435a" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
    </div>

    <div class="rmd-body">  
      <div id="rmdEstado">
        <div class="status-dot borrador" id="statusDot"></div>
        <span class="status-label" id="statusLabel">Borrador</span>   
      </div>
      <h2 class="rmd-title" id="rmdTitle">—</h2>
      <div class="rmd-chips" id="rmdChips"></div>
      <div class="rmd-meta">
        <span><strong>Tiempo preparación:</strong> <span id="rmdTiempo">—</span></span>
        <span><strong>Calorías:</strong> <span id="rmdCalorias">—</span></span>
      </div>
      <p class="rmd-desc" id="rmdDesc"></p>
      <div class="rmd-steps-wrap" id="rmdStepsWrap"></div>
            <!-- Rating -->
      <div class="rmd-rating" id="rmdRating">
        <span class="rating-label">Calificar receta:</span>
        <div class="stars-row" id="starsRow"></div>
        <span class="rating-text" id="ratingText">Sin calificar</span>
      </div>
      <!-- End Rating -->
      <div class="rmd-footer">
        <button class="rmd-btn-save" id="rmdBtnSave">Guardar Receta</button>
        <button class="rmd-btn-share" id="rmdBtnShare" title="Copiar link">
          <svg height="18px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M15.197 3.35462C16.8703 1.67483 19.4476 1.53865 20.9536 3.05046C22.4596 4.56228 22.3239 7.14956 20.6506 8.82935L18.2268 11.2626M10.0464 14C8.54044 12.4882 8.67609 9.90087 10.3494 8.22108L12.5 6.06212" stroke="#e8435a" stroke-width="1.5" stroke-linecap="round"></path> <path d="M13.9536 10C15.4596 11.5118 15.3239 14.0991 13.6506 15.7789L11.2268 18.2121L8.80299 20.6454C7.12969 22.3252 4.55237 22.4613 3.0464 20.9495C1.54043 19.4377 1.67609 16.8504 3.34939 15.1706L5.77323 12.7373" stroke="#e8435a" stroke-width="1.5" stroke-linecap="round"></path> </g></svg>
        </button>
        <button class="rmd-btn-flag" id="rmdBtnFlag" title="Reportar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
<!-- End of related to the recipe card to save and report recipes -->


<script src="index.js"></script>
<div class="share-toast" id="shareToast">¡Link copiado!</div>
</body>
</html>
