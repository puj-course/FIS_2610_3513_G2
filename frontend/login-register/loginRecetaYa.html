<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de Sesión | RecetaYa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loginRecetaYa.css">
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="card">
  <h1>Inicio de Sesión</h1>
  <div id="msg" class="msg"></div>
  <div class="input-wrap">
    <input type="email" id="email" placeholder="Correo" />
  </div>
  <div class="input-wrap">
    <input type="password" id="password" placeholder="Contraseña" />
    <button class="eye" id="eye" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <button class="btn" id="btn" onclick="login()">Iniciar Sesión</button>
  <p class="link-row">¿No tienes cuenta? <a href="registerRecetaYa.html">Regístrate</a></p>
</div>

<script src="loginRecetaYa.js">
</script>
</body>
</html>
