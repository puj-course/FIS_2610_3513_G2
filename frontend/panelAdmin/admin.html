<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecetaYa — Panel de Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header>
    <a class="logo" href="../IndexMain/index.html">
      <img class="logo-img" src="../../assets/logo.png" alt="RecetaYa" onerror="this.style.display='none'" />
      <span class="tx">Receta<span>Ya</span></span>
    </a>
    <span class="header-tag">— Panel de administración</span>
    <div class="header-right">
      <a class="btn-back" href="../IndexMain/index.html">← Volver</a>
    </div>
  </header>
  <main class="admin-wrapper">
  <aside class="sidebar">
    <ul class="sidebar__list">

        fill="currentColor" viewBox="0 0 24 24" >

        </svg>
        <div class="sidebar_hide">
          <p class="sidebar__text">Recetas</p>
        </div>
      </li>
      <li class="sidebar__element">
        <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
        fill="currentColor" viewBox="0 0 24 24" >

        <div class="sidebar_hide">
          <p class="sidebar__text">Usuarios</p>
        </div>
      </li>
      <li class="sidebar__element">
        <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
        fill="currentColor" viewBox="0 0 24 24" >
        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
        <path d="M4 2H2v19c0 .55.45 1 1 1h19v-2H4z"></path><path d="M15.4 12.8c.4.3.96.26 1.31-.09l5-5L20.3 6.3l-4.39 4.39-3.31-2.48c-.4-.3-.96-.26-1.31.09l-6 6 1.41 1.41 5.39-5.39z"></path>
        </svg>
        <div class="sidebar_hide">
          <p class="sidebar__text">Insights</p>
        </div>
      </li>
      <li class="sidebar__element">
        <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
        fill="currentColor" viewBox="0 0 24 24" >
        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
        <path d="M11 8h2v4.5h-2zm0 6h2v2h-2z"></path><path d="M12 2C6.49 2 2 6.49 2 12c0 2.12.68 4.19 1.93 5.9l-1.75 2.53c-.21.31-.24.7-.06 1.03.17.33.51.54.89.54h9c5.51 0 10-4.49 10-10S17.51 2 12 2m0 18H4.91L6 18.43c.26-.37.23-.88-.06-1.22A7.98 7.98 0 0 1 4.01 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8Z"></path>
        </svg>
        <div class="sidebar_hide">
          <p class="sidebar__text">Revisión</p>
        </div>
      </li>
    </ul>
  </aside>
  <div class="page">
    <div class="page-heading">
      <h1>Recetas <span>pendientes</span></h1>
      <p>Revisa cada receta antes de publicarla. Puedes aprobarla, rechazarla o eliminarla.</p>
    </div>

    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Cargando recetas...</p>
    </div>

    <div id="recetasContainer"></div>

    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">✓</div>
      <p>No hay recetas pendientes por revisar.</p>
    </div>
  </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
